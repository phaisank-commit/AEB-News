<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB Solo Challenge V3.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4e5;color:#173e30;font:16px/1.5 system-ui,sans-serif}header{background:#07563d;color:white;padding:14px}header div{max-width:860px;margin:auto;display:flex;align-items:center;gap:12px}header img{width:48px;height:48px;background:white;border-radius:10px;object-fit:contain}header b{font-size:25px}main{max-width:860px;margin:auto;padding:14px}section{background:white;border:1px solid #dbe5d6;padding:20px;border-radius:18px;margin:12px 0}h1,h2,h3,p{margin:0 0 12px}.hero{background:linear-gradient(120deg,#def0b5,#fff2b3)}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px;background:#086044;color:white;font-weight:700;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}button.full{width:100%}.light{background:#e5efdc;color:#174b35}.yellow{background:#ffda3b;color:#173e30}input,select{width:100%;padding:10px;border:1px solid #aabfaa;border-radius:10px;margin:4px 0 10px}.option{width:100%;text-align:left;background:#f1f6e9;color:#183c2a;border:2px solid #d4e2cd}.option:hover{border-color:#338557}.tag{font-weight:800;color:#07563d}.big{font-size:52px;font-weight:900}.bar{height:9px;background:#dce9d5;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#51a34c}.rank{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #e3eadf;align-items:center}.rank b{font-size:21px}.muted,small{color:#52665b}.winner{background:#fff1a9;border:2px solid #e8be31}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{background:#e1efca;border-radius:30px;padding:5px 12px;font-weight:700}footer{text-align:center;font-size:12px;padding:20px;color:#52665b}a{color:#07563d}@media(max-width:500px){section{padding:15px}h1{font-size:26px}header b{font-size:20px}}
</style></head><body><header><div><img src="ab.jpg" alt="AB"><span><b>AB SOLO CHALLENGE</b><br>🌱 DEK70 • SAIYAI</span><img src="agri.jpg" alt="AGRI" style="margin-left:auto"></div></header><main id="app"></main><footer>เศรษฐศาสตร์เกษตรและธุรกิจเกษตร • คณะเกษตรศาสตร์ • มทร.ศรีวิชัย</footer><script>
const Q=[
['📊 วิเคราะห์ข้อมูล','ทีมจะขายผลไม้ในโรงเรียน ข้อมูลใดช่วยตัดสินใจได้ตรงที่สุด?',['จำนวนคนที่อยากซื้อและราคาที่ยอมจ่าย','จำนวนยอดไลก์ของร้านที่ไม่เกี่ยวข้อง','สีเสื้อของทีม'],0,'ข้อมูลความต้องการและราคาช่วยวางแผนผลิตให้ตรงตลาด'],
['📊 วิเคราะห์ข้อมูล','สำรวจลูกค้า 40 คน ชอบมังคุด 25 คน ชอบเงาะ 15 คน หากต้องเริ่มทดลองขายหนึ่งชนิด ควรเลือกอะไร?',['เงาะ เพราะคนเลือกน้อย','มังคุด เพราะมีผู้สนใจมากกว่า','ไม่ต้องดูผลสำรวจ'],1,'ข้อมูลชี้ว่ามังคุดมีความสนใจสูงกว่าในกลุ่มตัวอย่าง'],
['💡 ผู้ประกอบการ','ในตลาดมีน้ำผลไม้หลายร้าน จะสร้างความแตกต่างได้อย่างไร?',['ลอกชื่อและโลโก้คู่แข่ง','เพิ่มราคาทันทีโดยไม่ปรับสินค้า','สร้างสูตรหรือเรื่องราวท้องถิ่นที่ลูกค้าให้คุณค่า'],2,'ความแตกต่างที่ลูกค้าเห็นคุณค่าช่วยสร้างแบรนด์'],
['💡 ผู้ประกอบการ','มีไอเดียกล้วยฉาบรสใหม่ ก่อนลงทุนผลิตจำนวนมาก ควรทำอะไร?',['ทดลองทำล็อตเล็กให้ลูกค้าชิมและรับฟังความเห็น','ผลิตทันที 1,000 ถุง','ซื้ออุปกรณ์แพงที่สุดก่อน'],0,'ทดลองตลาดลดความเสี่ยงก่อนลงทุน'],
['💰 ธุรกิจและการเงิน','ต้นทุนกล่องผลไม้ 40 บาท ขาย 60 บาท กำไรขั้นต้นต่อกล่องเท่าไร (ยังไม่รวมค่าใช้จ่ายอื่น)?',['10 บาท','20 บาท','100 บาท'],1,'60 − 40 = 20 บาท'],
['💰 ธุรกิจและการเงิน','มีทุน 1,000 บาท ผลิตกล่องละ 40 บาท ต้องเก็บเงินสำรอง 200 บาท ผลิตได้สูงสุดกี่กล่อง?',['25 กล่อง','30 กล่อง','20 กล่อง'],2,'(1,000 − 200) ÷ 40 = 20 กล่อง',true],
['🚚 โลจิสติกส์','ลูกค้า 3 รายอยู่ในเส้นทางเดียวกัน ควรจัดส่งอย่างไรเพื่อลดการเดินทาง?',['รวมรอบส่งตามเส้นทาง','แยกส่ง 3 เที่ยวโดยไม่จำเป็น','ส่งย้อนกลับไปมาหลายรอบ'],0,'รวมเส้นทางลดเที่ยวรถและต้นทุนได้'],
['🚚 โลจิสติกส์','ต้องส่งผลไม้สดที่ช้ำง่ายให้ถึงลูกค้า ควรเน้นเรื่องใด?',['เลือกกล่องใหญ่ที่สุดโดยไม่รองรับสินค้า','บรรจุให้เหมาะสมและควบคุมเวลาในการส่ง','วางกลางแดดก่อนส่ง'],1,'บรรจุภัณฑ์และเวลาขนส่งช่วยรักษาคุณภาพ'],
['📱 การตลาดและคอนเทนต์','งบจำกัด อยากให้เพื่อนในโรงเรียนรู้จักสินค้า วิธีใดเหมาะที่สุด?',['ซื้อโฆษณาแพงโดยไม่กำหนดกลุ่มเป้าหมาย','โพสต์ข้อความที่ไม่เกี่ยวกับสินค้า','ทำคลิปสั้นแนะนำสินค้าและช่องทางสั่งซื้อ'],2,'คลิปที่ตรงกลุ่มเป้าหมายและมีช่องทางสั่งซื้อช่วยให้ขายได้'],
['📱 การตลาดและคอนเทนต์','โพสต์มียอดวิวสูง แต่ไม่มีคนสั่งซื้อ ควรทำอะไรต่อ?',['ตรวจข้อเสนอ ราคา และขั้นตอนสั่งซื้อ แล้วปรับ','เพิ่มยอดวิวอย่างเดียว','หยุดรับฟังลูกค้า'],0,'ยอดวิวไม่เท่ากับยอดขาย ต้องดูการเปลี่ยนผู้ชมเป็นลูกค้า'],
['🌱 ส่งเสริมการเกษตร','เกษตรกรในชุมชนขายผลไม้ได้ราคาต่ำ ทีมควรเริ่มช่วยอย่างไร?',['กำหนดแผนเองโดยไม่คุยกับเกษตรกร','ลงพื้นที่รับฟังปัญหาและร่วมกันหาตลาด','รับซื้อโดยไม่ตกลงราคา'],1,'การมีส่วนร่วมช่วยให้แผนตอบโจทย์ชุมชน'],
['🌱 ส่งเสริมการเกษตร','ธุรกิจมีกำไรแล้ว วิธีใดสร้างความยั่งยืนแก่ธุรกิจและชุมชนที่สุด?',['ลดคุณภาพเพื่อเพิ่มกำไรอย่างเดียว','เลิกติดต่อเกษตรกรหลังขายหมด','ตกลงราคาที่เป็นธรรม รักษาคุณภาพ และร่วมวางแผนกับเกษตรกร'],2,'ความเป็นธรรม คุณภาพ และความร่วมมือสร้างความยั่งยืน',true]];
const app=document.getElementById('app'),$=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAX=1400,KEY='ab-solo-challenge-v31';let name='',round=0,score=0,correct=0,ms=0,started=0,phase='home',history=[],opts=[],questions=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function results(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveResult(row){try{let rows=results();rows.push(row);localStorage.setItem(KEY,JSON.stringify(rows));return true}catch(e){return false}}
function ranked(rows=results()){return [...rows].sort((a,b)=>b.score-a.score||b.correct-a.correct||a.ms-b.ms)}
function tie(a,b){return a.score===b.score&&a.correct===b.correct&&a.ms===b.ms}
function board(rows=results()){let r=ranked(rows);return '<section><h3>🏆 อันดับบนอุปกรณ์นี้</h3>'+(r.length?r.map((t,i)=>{let rank=r.findIndex(x=>tie(x,t))+1;return '<div class="rank"><span>'+(['','🥇','🥈','🥉'][rank]||rank)+'</span><div>'+esc(t.name)+'<br><small>ถูก '+t.correct+'/12 • '+(t.ms/1000).toFixed(2)+' วินาที</small></div><b>'+t.score+'</b></div>'}).join(''):'<p class="muted">ยังไม่มีผลการแข่งขัน</p>')+'<small>คะแนนสูงสุด → จำนวนข้อถูก → เวลาตอบรวมน้อยสุด ถ้าเท่ากันทั้งหมดเป็นอันดับร่วม</small></section>'}
function show(h){app.innerHTML=h;window.scrollTo(0,0)}
function home(){phase='home';show('<section class="hero"><div class="tag">🎮 SOLO CHALLENGE • เล่นคนเดียว</div><h1>ใครจะเป็นแชมป์ AB?</h1><p>6 สายอาชีพ • 12 คำถาม • 2 ข้อโบนัส</p><div class="big">1,400 <small style="font-size:20px">คะแนน</small></div><p>ตอบเองทุกข้อ สะสมคะแนนและลุ้นอันดับ!</p></section><section><label for="nickname">ชื่อเล่นหรือฉายา (ไม่ต้องใช้ชื่อจริง)</label><input id="nickname" maxlength="30" placeholder="เช่น มังคุดตัวตึง"><button class="full" onclick="begin()">🚀 เริ่มเล่นคนเดียว</button><small>ไม่ต้องสมัครสมาชิก คะแนนเก็บบนเครื่องนี้เท่านั้น หากเล่นคนละมือถือ ให้ส่งภาพผลคะแนนแก่ผู้จัดเพื่อจัดอันดับรวม</small></section>'+board())}
function begin(){name=$('nickname').value.trim()||'ผู้เล่น AB';round=score=correct=ms=0;history=[];questions=Array.from({length:6},(_,i)=>shuffle([Q[i*2],Q[i*2+1]])).flat();ready()}
function stats(){return '<div class="row"><span class="pill">ข้อ '+(round+1)+'/12</span><span class="pill">⭐ '+score+' คะแนน</span></div><div class="bar"><i style="width:'+round/12*100+'%"></i></div>'}
function ready(){phase='ready';let q=questions[round];show(stats()+'<section class="hero"><div class="tag">ด่าน '+(Math.floor(round/2)+1)+'/6</div><h2>'+q[0]+'</h2><p>'+ (q[5]?'🔥 ข้อโบนัส 200 คะแนน':'ตอบถูก +100 คะแนน')+'</p><p>จับเวลาตั้งแต่เปิดคำถาม</p><button class="full" onclick="ask()">พร้อมแล้ว! เปิดคำถาม</button></section>')}
function ask(){if(phase!=='ready')return;phase='question';let q=questions[round];opts=shuffle(q[2].map((v,i)=>({v,i})));show(stats()+'<section><div class="tag">'+q[0]+' • '+(q[5]?'🔥 200':'100')+' คะแนน</div><h2>'+q[1]+'</h2>'+opts.map((x,j)=>'<button class="option" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+x.v+'</button>').join('')+'<small>เลือกได้เพียงครั้งเดียว</small></section>');started=performance.now()}
function answer(j){if(phase!=='question')return;phase='reveal';let q=questions[round],ok=opts[j].i===q[3],elapsed=Math.max(0,Math.round(performance.now()-started)),points=ok?(q[5]?200:100):0;score+=points;correct+=+ok;ms+=elapsed;history.push({ok,points,career:q[0]});show(stats()+'<section class="hero"><div class="tag">'+(ok?'🎉 ถูกต้อง!':'💪 พลาดไปนิดเดียว')+'</div><div class="big">+'+points+'</div><h3>คำตอบ: '+q[2][q[3]]+'</h3><p>'+q[4]+'</p><button class="full" onclick="next()">'+(round===11?'ดูคะแนนของฉัน 🏆':'ไปข้อถัดไป →')+'</button></section>')}
function next(){if(phase!=='reveal')return;round++;if(round===12)finish();else ready()}
function finish(){phase='done';let row={name,score,correct,ms,id:Date.now()+Math.random()},persisted=saveResult(row),rows=persisted?results():[...results(),row],r=ranked(rows),rank=r.findIndex(t=>tie(t,row))+1;show('<section class="winner"><div class="tag">🏁 AB SOLO CHALLENGE • ผลการแข่งขัน</div><h1>'+esc(name)+'</h1><div class="big">'+score+'<small style="font-size:20px"> / '+MAX+'</small></div><h3>'+(rank===1?'🏆 อันดับ 1 บนอุปกรณ์นี้':'อันดับ '+rank+' บนอุปกรณ์นี้')+'</h3><p>ตอบถูก '+correct+'/12 ข้อ • เวลาตอบรวม '+(ms/1000).toFixed(2)+' วินาที</p><small>แคปหน้าจอนี้ส่งผู้จัดการแข่งขันเพื่อนำไปจัดอันดับรวม</small></section><section><h3>📊 คะแนนแยกตามสายอาชีพ</h3>'+Array.from({length:6},(_,i)=>{let h=history.slice(i*2,i*2+2),p=h.reduce((a,x)=>a+x.points,0),m=(i===2||i===5)?300:200;return '<p>'+h[0].career+' — <b>'+p+'/'+m+'</b></p><div class="bar"><i style="width:'+p/m*100+'%"></i></div>'}).join('')+'</section>'+board(rows)+'<section><button class="full" onclick="home()">เล่นใหม่ / ผู้เล่นคนถัดไป</button><p><a href="https://admission.rmutsv.ac.th/register.php" target="_blank" rel="noopener">🌱 สมัครเรียน AB ไสใหญ่</a></p><small>'+(persisted?'ผลบันทึกบนอุปกรณ์นี้แล้ว':'เบราว์เซอร์ไม่อนุญาตให้บันทึกคะแนน กรุณาแคปหน้าจอ')+'</small></section>')}
home();</script></body></html>
