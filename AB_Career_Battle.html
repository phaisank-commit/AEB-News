<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB Career Battle</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4e5;color:#173e30;font:16px/1.5 system-ui,sans-serif}header{background:#07563d;color:white;padding:14px}header div{max-width:860px;margin:auto;display:flex;align-items:center;gap:12px}header img{width:48px;height:48px;background:white;border-radius:10px;object-fit:contain}header b{font-size:25px}main{max-width:860px;margin:auto;padding:14px}section{background:white;border:1px solid #dbe5d6;padding:20px;border-radius:18px;margin:12px 0}h1,h2,h3,p{margin:0 0 12px}.hero{background:linear-gradient(120deg,#def0b5,#fff2b3)}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px;background:#086044;color:white;font-weight:700;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}button.full{width:100%}.light{background:#e5efdc;color:#174b35}.yellow{background:#ffda3b;color:#173e30}input,select{width:100%;padding:10px;border:1px solid #aabfaa;border-radius:10px;margin:4px 0 10px}.option{width:100%;text-align:left;background:#f1f6e9;color:#183c2a;border:2px solid #d4e2cd}.option:hover{border-color:#338557}.tag{font-weight:800;color:#07563d}.big{font-size:52px;font-weight:900}.bar{height:9px;background:#dce9d5;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#51a34c}.rank{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #e3eadf;align-items:center}.rank b{font-size:21px}.muted,small{color:#52665b}.winner{background:#fff1a9;border:2px solid #e8be31}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{background:#e1efca;border-radius:30px;padding:5px 12px;font-weight:700}footer{text-align:center;font-size:12px;padding:20px;color:#52665b}a{color:#07563d}@media(max-width:500px){section{padding:15px}h1{font-size:26px}header b{font-size:20px}}
</style></head><body><header><div><img src="ab.jpg" alt="AB"><span><b>AB CAREER BATTLE</b><br>🌱 DEK70 • SAIYAI</span><img src="agri.jpg" alt="AGRI" style="margin-left:auto"></div></header><main id="app"></main><footer>เศรษฐศาสตร์เกษตรและธุรกิจเกษตร • คณะเกษตรศาสตร์ • มทร.ศรีวิชัย</footer><script>
const Q=[
['📊 วิเคราะห์ข้อมูล','ทีมจะขายผลไม้ในโรงเรียน ข้อมูลใดช่วยตัดสินใจได้ตรงที่สุด?',['จำนวนคนที่อยากซื้อและราคาที่ยอมจ่าย','จำนวนยอดไลก์ของร้านที่ไม่เกี่ยวข้อง','สีเสื้อของทีม'],0,'ข้อมูลความต้องการและราคาช่วยวางแผนผลิตให้ตรงตลาด'],
['📊 วิเคราะห์ข้อมูล','สำรวจลูกค้า 40 คน ชอบมังคุด 25 คน ชอบเงาะ 15 คน หากต้องเริ่มทดลองขายหนึ่งชนิด ควรเลือกอะไร?',['เงาะ เพราะคนเลือกน้อย','มังคุด เพราะมีผู้สนใจมากกว่า','ไม่ต้องดูผลสำรวจ'],1,'ข้อมูลชี้ว่ามังคุดมีความสนใจสูงกว่าในกลุ่มตัวอย่าง'],
['💡 ผู้ประกอบการ','ในตลาดมีน้ำผลไม้หลายร้าน จะสร้างความแตกต่างได้อย่างไร?',['ลอกชื่อและโลโก้คู่แข่ง','เพิ่มราคาทันทีโดยไม่ปรับสินค้า','สร้างสูตรหรือเรื่องราวท้องถิ่นที่ลูกค้าให้คุณค่า'],2,'ความแตกต่างที่ลูกค้าเห็นคุณค่าช่วยสร้างแบรนด์'],
['💡 ผู้ประกอบการ','มีไอเดียกล้วยฉาบรสใหม่ ก่อนลงทุนผลิตจำนวนมาก ควรทำอะไร?',['ทดลองทำล็อตเล็กให้ลูกค้าชิมและรับฟังความเห็น','ผลิตทันที 1,000 ถุง','ซื้ออุปกรณ์แพงที่สุดก่อน'],0,'ทดลองตลาดลดความเสี่ยงก่อนลงทุน'],
['💰 ธุรกิจและการเงิน','ต้นทุนกล่องผลไม้ 40 บาท ขาย 60 บาท กำไรขั้นต้นต่อกล่องเท่าไร (ยังไม่รวมค่าใช้จ่ายอื่น)?',['10 บาท','20 บาท','100 บาท'],1,'60 − 40 = 20 บาท'],
['💰 ธุรกิจและการเงิน','มีทุน 1,000 บาท ผลิตกล่องละ 40 บาท ต้องเก็บเงินสำรอง 200 บาท ผลิตได้สูงสุดกี่กล่อง?',['25 กล่อง','30 กล่อง','20 กล่อง'],2,'(1,000 − 200) ÷ 40 = 20 กล่อง',true],
['🚚 โลจิสติกส์','ลูกค้า 3 รายอยู่ในเส้นทางเดียวกัน ควรจัดส่งอย่างไรเพื่อลดการเดินทาง?',['รวมรอบส่งตามเส้นทาง','แยกส่ง 3 เที่ยวโดยไม่จำเป็น','ส่งย้อนกลับไปมาหลายรอบ'],0,'รวมเส้นทางลดเที่ยวรถและต้นทุนได้'],
['🚚 โลจิสติกส์','ต้องส่งผลไม้สดที่ช้ำง่ายให้ถึงลูกค้า ควรเน้นเรื่องใด?',['เลือกกล่องใหญ่ที่สุดโดยไม่รองรับสินค้า','บรรจุให้เหมาะสมและควบคุมเวลาในการส่ง','วางกลางแดดก่อนส่ง'],1,'บรรจุภัณฑ์และเวลาขนส่งช่วยรักษาคุณภาพ'],
['📱 การตลาดและคอนเทนต์','งบจำกัด อยากให้เพื่อนในโรงเรียนรู้จักสินค้า วิธีใดเหมาะที่สุด?',['ซื้อโฆษณาแพงโดยไม่กำหนดกลุ่มเป้าหมาย','โพสต์ข้อความที่ไม่เกี่ยวกับสินค้า','ทำคลิปสั้นแนะนำสินค้าและช่องทางสั่งซื้อ'],2,'คลิปที่ตรงกลุ่มเป้าหมายและมีช่องทางสั่งซื้อช่วยให้ขายได้'],
['📱 การตลาดและคอนเทนต์','โพสต์มียอดวิวสูง แต่ไม่มีคนสั่งซื้อ ควรทำอะไรต่อ?',['ตรวจข้อเสนอ ราคา และขั้นตอนสั่งซื้อ แล้วปรับ','เพิ่มยอดวิวอย่างเดียว','หยุดรับฟังลูกค้า'],0,'ยอดวิวไม่เท่ากับยอดขาย ต้องดูการเปลี่ยนผู้ชมเป็นลูกค้า'],
['🌱 ส่งเสริมการเกษตร','เกษตรกรในชุมชนขายผลไม้ได้ราคาต่ำ ทีมควรเริ่มช่วยอย่างไร?',['กำหนดแผนเองโดยไม่คุยกับเกษตรกร','ลงพื้นที่รับฟังปัญหาและร่วมกันหาตลาด','รับซื้อโดยไม่ตกลงราคา'],1,'การมีส่วนร่วมช่วยให้แผนตอบโจทย์ชุมชน'],
['🌱 ส่งเสริมการเกษตร','ธุรกิจมีกำไรแล้ว วิธีใดสร้างความยั่งยืนแก่ธุรกิจและชุมชนที่สุด?',['ลดคุณภาพเพื่อเพิ่มกำไรอย่างเดียว','เลิกติดต่อเกษตรกรหลังขายหมด','ตกลงราคาที่เป็นธรรม รักษาคุณภาพ และร่วมวางแผนกับเกษตรกร'],2,'ความเป็นธรรม คุณภาพ และความร่วมมือสร้างความยั่งยืน',true]];
const app=document.getElementById('app'),$=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let teams=[],round=0,turn=0,phase='ready',answers=[],started=0;const max=1400,store='ab-career-battle-v2';
function save(){try{localStorage.setItem(store,JSON.stringify({teams,round,turn,phase,answers}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(store)||'null')}catch(e){return null}}
function show(h){app.innerHTML=h;window.scrollTo(0,0)}
function names(){let n=+$('count').value;$('names').innerHTML=Array.from({length:n},(_,i)=>'<label>ทีม '+(i+1)+'</label><input id="t'+i+'" maxlength="40" placeholder="ทีม '+(i+1)+'">').join('')}
function home(){show('<section class="hero"><div class="tag">🏆 เกมแข่งขัน 6 สายอาชีพ</div><h1>ใครจะเป็นแชมป์ AB?</h1><p>12 คำถาม • 2 ข้อโบนัส • เต็ม 1,400 คะแนน</p><p>เล่นทีละทีมบนเครื่องเดียว ทีมอื่นรอโดยไม่ดูคำตอบ ระบบเฉลยพร้อมกันเมื่อทุกทีมตอบครบ</p></section><section><label>จำนวนทีม</label><select id="count" onchange="names()">'+Array.from({length:7},(_,i)=>'<option '+(i===2?'selected':'')+'>'+(i+2)+'</option>').join('')+'</select><div id="names"></div><button class="full" onclick="begin()">เริ่มแข่งขัน 🚀</button>'+(load()?'<button class="light full" onclick="resume()">เล่นต่อ / ดูผลล่าสุด</button>':'')+'<small>คะแนนเก็บบนอุปกรณ์นี้ ไม่ต้องใช้ชื่อจริง ไม่เชื่อมคะแนนข้ามเครื่อง</small></section>');names()}
function begin(){teams=Array.from({length:+$('count').value},(_,i)=>({name:$('t'+i).value.trim()||'ทีม '+(i+1),score:0,correct:0,ms:0}));round=turn=0;phase='ready';answers=[];save();render()}
function resume(){let d=load();if(!d)return;({teams,round,turn,phase,answers}=d);if(phase==='question')phase='ready';render()}
function order(){return teams.map((_,i)=>(i+round)%teams.length)}
function rank(){return teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score||b.correct-a.correct||a.ms-b.ms)}
function same(a,b){return a.score===b.score&&a.correct===b.correct&&a.ms===b.ms}
function board(){let r=rank();return '<section><h3>📊 ตารางคะแนน'+(phase==='done'?'สุดท้าย':'สะสม')+'</h3>'+r.map((t,i)=>'<div class="rank"><span>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</span><div>'+esc(t.name)+'<br><small>ถูก '+t.correct+' ข้อ • '+(t.ms/1000).toFixed(1)+' วินาที</small></div><b>'+t.score+'</b></div>').join('')+'</section>'}
function render(){if(phase==='done')return finish();let q=Q[round],i=order()[turn],h='<div class="row"><b>ข้อ '+(round+1)+'/12 • ด่าน '+(Math.floor(round/2)+1)+'/6</b><span class="pill">'+(q[5]?'🔥 โบนัส 200':'100 คะแนน')+'</span></div><div class="bar"><i style="width:'+round/12*100+'%"></i></div>';if(phase==='ready'){h+='<section class="hero"><div class="tag">'+q[0]+'</div><h2>ส่งเครื่องให้ '+esc(teams[i].name)+'</h2><p>ทีมที่ '+(turn+1)+' จาก '+teams.length+' • ให้ทุกคนร่วมคิดก่อนเลือกคำตอบ</p><p>กดเริ่มเมื่อพร้อม จับเวลาตั้งแต่แสดงคำถาม</p><button class="full" onclick="ask()">พร้อม! เปิดคำถาม</button></section>'}else if(phase==='question'){h+='<section><div class="tag">'+q[0]+' • '+esc(teams[i].name)+'</div><h2>'+q[1]+'</h2>'+q[2].map((x,j)=>'<button class="option" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('')+'<small>เลือกได้ 1 ครั้ง • ไม่เฉลยจนกว่าทุกทีมตอบครบ</small></section>'}else{h+='<section class="hero"><div class="tag">เฉลย • '+q[0]+'</div><h2>✅ '+q[2][q[3]]+'</h2><p>'+q[4]+'</p>'+answers.map(a=>'<div class="rank"><span>'+(a.ok?'✅':'❌')+'</span><div>'+esc(teams[a.i].name)+'<br><small>เลือก '+String.fromCharCode(65+a.choice)+'</small></div><b>+'+a.points+'</b></div>').join('')+'<button class="full" onclick="next()">'+(round===11?'ประกาศผู้ชนะ 🏆':'ไปข้อถัดไป →')+'</button></section>'}if(phase==='ready'||phase==='reveal')h+=board();show(h)}
function ask(){if(phase!=='ready')return;phase='question';save();render();started=performance.now()}
function answer(choice){if(phase!=='question')return;let i=order()[turn],q=Q[round],ok=choice===q[3],ms=Math.max(0,Math.round(performance.now()-started)),points=ok?(q[5]?200:100):0;answers.push({i,choice,ok,points,ms});turn++;if(turn===teams.length){answers.forEach(a=>{teams[a.i].score+=a.points;teams[a.i].correct+=+a.ok;teams[a.i].ms+=a.ms});phase='reveal'}else phase='ready';save();render()}
function next(){if(phase!=='reveal')return;round++;turn=0;answers=[];phase=round===12?'done':'ready';save();render()}
function finish(){let r=rank(),w=r.filter(t=>same(t,r[0]));show('<section class="winner"><div class="tag">🏆 '+(w.length>1?'แชมป์ร่วม':'แชมป์ AB CAREER BATTLE')+'</div><h1>'+w.map(t=>esc(t.name)).join(' • ')+'</h1><div class="big">'+r[0].score+'<small style="font-size:20px"> / '+max+'</small></div><p>ยินดีด้วย! ตอบถูก '+r[0].correct+' จาก 12 ข้อ</p></section>'+board()+'<section><h3>🌱 น้องชอบสายไหนที่สุด?</h3><p>ชวนสมาชิกเลือก 1 จาก 6 สาย และเล่าเหตุผลให้เพื่อนฟัง</p>'+[0,2,4,6,8,10].map(i=>'<p>'+Q[i][0]+'</p>').join('')+'<p class="muted">ตัดสินคะแนนสูงสุด → จำนวนข้อถูก → เวลาตอบรวมต่ำสุด หากเท่ากันทุกเกณฑ์เป็นแชมป์ร่วม</p><button class="full" onclick="home()">แข่งขันรอบใหม่</button><p><a href="https://admission.rmutsv.ac.th/register.php" target="_blank" rel="noopener">สมัครเรียน AB ไสใหญ่</a></p></section>')}
home();</script></body></html>
